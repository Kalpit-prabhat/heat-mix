# Final study (2026-11-17): 3D serpentine 3 x 3 mm, heater on all 4 walls from the channel start, length by heater sweep
# generated by cases/final/make_cases.py - edit that file, not this one
case:
  function: sine_channel
  matlab_dir: ../sine_channel
variables:
  lam:
    min: 6.5
    max: 20
    unit: mm
    log: true
  A:
    min: 0.0
    max: 3.5
    unit: mm
fixed:
  w:
    value: 3
    unit: mm
  depth:
    value: 3
    unit: mm
  Qv:
    value: 6
    unit: ml/min
  T_in:
    value: 343.15
    unit: K
  dT_target:
    value: 2
    unit: K
  T_heat_max:
    value: 372.15
    unit: K
  h_heat:
    value: 100000.0
    unit: W/(m^2*K)
  h_loss:
    value: 2
    unit: W/(m^2*K)
  T_amb:
    value: 293.15
    unit: K
  rho0:
    value: 972.4
    unit: kg/m^3
  mu0:
    value: 0.000355
    unit: Pa*s
  k0:
    value: 0.669
    unit: W/(m*K)
  Cp0:
    value: 4196
    unit: J/(kg*K)
  L:
    value: 29
    unit: mm
  L_port:
    value: 2
    unit: mm
  L_port_out:
    value: 3
    unit: mm
  L_ext:
    value: 5
    unit: mm
  phi:
    value: 0
    unit: ''
  heat_type:
    value: 1
    unit: ''
  power_mode:
    value: 1
    unit: ''
  P_fac_min:
    value: 1.0
    unit: ''
  P_fac_max:
    value: 2.0
    unit: ''
  heat_tb:
    value: 1
    unit: ''
  sym:
    value: 1
    unit: ''
  dxs:
    value: 0.1
    unit: mm
  R_bend:
    value: 1.55
    unit: mm
  heat_start:
    value: 2
    unit: mm
  heat_len:
    value: 24
    unit: mm
  wall_mode:
    value: 1
    unit: ''
loss:
  primary: l2_flow
  sweep_best: true
comsol_opts:
  solver: direct_heat
  ny: 40
  nz: 20
  heat_linsolver: mumps
  flow_ramp_retry: 0.1 0.4 1
  profile_nb: 0
  heat_list:
  - - 2
    - 2.4000000000000004
  - - 2
    - 4.800000000000001
  - - 2
    - 7.199999999999999
  - - 2
    - 9.600000000000001
  - - 2
    - 12.0
  - - 2
    - 14.399999999999999
  - - 2
    - 16.799999999999997
  - - 2
    - 19.200000000000003
  - - 2
    - 21.6
  - - 2
    - 24.0
  mesh:
    coarse:
      type: mapped
      n_w: 20
      w_ratio: 3
      hxy: 0.12
      nz: 8
    fine:
      type: mapped
      n_w: 28
      w_ratio: 3
      hxy: 0.08
      nz: 12
optimizer:
  seed: 0
  fine_top_min_sep: 0.1
  n_fine_iters: 0
  trust_region: 0.15
  n_workers: 4
  xi: 0.01
  n_candidates: 20000
  failure_penalty: 0.5
  n_init: 8
  n_coarse: 28
  fine_top_k: 2
comsol:
  backend: engine
  port: 2070
  start_server: true
  comsol_cmd: ${COMSOL_ROOT}/bin/comsol
  matlab_cmd: matlab
  mli_path: ${COMSOL_ROOT}/mli
  server_args:
  - -np
  - '4'
  timeout_s: 1800
  restart_every: 0
  reuse_model: true
output:
  name: final_u3d_serp
  save_mph_coarse: false
  save_mph_fine: false
  fields_best: true
  progress_every: 5
grid:
  L0:
    lam: 6
    A: 5
  zoom:
  - - 2
    - 0.5
  fine_top: 2
